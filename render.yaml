# Render Blueprint — deploy automatizado.
# Conecte seu repositório GitHub ao Render e ele lê este arquivo.
# Docs: https://render.com/docs/blueprint-spec
services:
  # --- Aplicação web ---
  - type: web
    name: rayane-yasmin-site
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --threads 4 --workers 1 --timeout 120 --access-logfile -
    envVars:
      - key: SECRET_KEY
        generateValue: true  # Render gera um valor aleatório automaticamente
      - key: ADMIN_PASSWORD_HASH
        sync: false  # Você define manualmente no dashboard (ver README)
      - key: DATABASE_URL
        fromDatabase:
          name: rayane-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"  # Troque para redis:// se tiver Redis
    # Disk persistente para as fotos enviadas (não somem ao redeployar)
    disk:
      name: uploads
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # --- Banco PostgreSQL ---
  - type: postgresql
    name: rayane-db
    plan: free
    ipAllowList: []  # acesso apenas de serviços internos do Render