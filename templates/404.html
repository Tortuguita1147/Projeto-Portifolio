{% extends "base.html" %}
{% block content %}
<section class="section section--dark" style="min-height: 60vh; display: flex; align-items: center;">
  <div class="section__inner section__inner--narrow" style="text-align: center;">
    <p class="eyebrow eyebrow--on-dark">404</p>
    <h1 class="section__title section__title--on-dark">Página não encontrada</h1>
    <p class="section__lead section__lead--on-dark" style="margin-bottom: 2rem;">
      O endereço que você procurou não existe ou está indisponível.
      Se recebeu um link de galeria, confira se ele foi copiado por completo.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn--gold">Voltar para o início</a>
  </div>
</section>
{% endblock %}
